packages:
  - apps/*/*
  - components/*
  - examples/*
  - frameworks/*
  - libraries/*
  - plugins/*
  - presets/*
  - tools/*

allowBuilds:
  esbuild: true
  fsevents: true

catalog:
  '@repobuddy/vitest': ^2.1.1

# Supply-chain soak. This lived in .npmrc as `minimumreleaseage=1440`, which npm rejects as an
# unknown config key and which `pnpm config get minimumReleaseAge` reported as undefined. pnpm
# did honour it during resolution, but in LOOSE mode: a package inside the window was silently
# appended to `minimumReleaseAgeExclude` in this file rather than refused. Strict makes pnpm
# stop and ask instead, so the gate cannot be bypassed by an ordinary `pnpm add`.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

overrides:
  # Upper bound added 2026-09-01. The replacement was previously open-ended
  # ('>=10.5.0'), so anything this matched would have been rewritten to glob 13
  # rather than to a patched glob 10. Nothing currently resolves in the matched
  # range -- rimraf 6 asks for glob ^13 directly -- so the override is dormant.
  # Exit condition: delete it once no dependency can request glob 10.2-10.4.
  glob@>=10.2.0 <10.5.0: '>=10.5.0 <11'


# First-party packages are exempt from the soak.
#
# The soak exists to stop a COMPROMISED THIRD-PARTY release being pulled into a build
# within hours of publication. It does not describe our own packages: we control what
# goes into them, and a first-party release is reviewed before it is published, not
# after. Applying it to ourselves only means a fresh publish is invisible to the next
# repo in the chain for 24h.
minimumReleaseAgeExclude:
  - assertron
  - satisfier
  - tersify
  - unpartial
  - type-plus
  - path-equal
  - iso-error
  - iso-error-web
  - iso-error-google-cloud-api
  - google-cloud-api
  - standard-log
  - standard-log-color
  - async-fp
  - fsa-emitter
  - progress-str
  - clibuilder
  - args-minus
  - global-store
  - stable-store
  - mocktomata
  - just-func
  - storybook-addon-vis
  - vitest-plugin-vis
  - node-supported-releases
  - '@just-func/*'
  - '@just-web/*'
  - '@mocktomata/*'
  - '@repobuddy/*'
  - '@unional/*'
