packages:
  - apps/*/*
  - components/*
  - examples/*
  - frameworks/*
  - libraries/*
  - plugins/*
  - presets/*
  - tools/*

allowBuilds:
  esbuild: true
  fsevents: true

catalog:
  '@repobuddy/vitest': ^2.1.4

# Supply-chain soak. This lived in .npmrc as `minimumreleaseage=1440`, which npm rejects as an
# unknown config key and which `pnpm config get minimumReleaseAge` reported as undefined. pnpm
# did honour it during resolution, but in LOOSE mode: a package inside the window was silently
# appended to `minimumReleaseAgeExclude` in this file rather than refused. Strict makes pnpm
# stop and ask instead, so the gate cannot be bypassed by an ordinary `pnpm add`.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# TEMPORARY. Remove once these have matured past the 1440-minute window; a
# revert PR doing exactly that is open and should be merged then.
#
# All seven published 2026-09-07 carrying the `type-plus` 8 move that finally
# lets this repo resolve a single major of tersify. The soak refused them,
# which is the gate working as designed -- this exempts these seven by name
# rather than weakening `minimumReleaseAgeStrict` for everything.
# Last of the set matures 2026-09-08T08:40Z (repobuddy 1.6.0).
minimumReleaseAgeExclude:
  - '@just-func/types'
  - '@repobuddy/typescript'
  - '@unional/events-plus'
  - assertron
  - clibuilder
  - iso-error
  - repobuddy
  - standard-log
  - standard-log-color

overrides:
  # Upper bound added 2026-09-01. The replacement was previously open-ended
  # ('>=10.5.0'), so anything this matched would have been rewritten to glob 13
  # rather than to a patched glob 10. Nothing currently resolves in the matched
  # range -- rimraf 6 asks for glob ^13 directly -- so the override is dormant.
  # Exit condition: delete it once no dependency can request glob 10.2-10.4.
  glob@>=10.2.0 <10.5.0: '>=10.5.0 <11'

